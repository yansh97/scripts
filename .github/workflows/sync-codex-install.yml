name: Sync Codex install script

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch install script
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh -o codex-install.sh
          chmod +x codex-install.sh

      - name: Commit if changed
        run: |
          git add codex-install.sh

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Codex install script"
          git push
